name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  grammar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install LanguageTool
        run: |
          curl -fsSL \
            https://languagetool.org/download/LanguageTool-6.6.zip \
            -o languagetool.zip

          echo "53600506b399bb5ffe1e4c8dec794fd378212f14aaf38ccef9b6f89314d11631  languagetool.zip" \
            | sha256sum --check

          unzip -q languagetool.zip
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Start LanguageTool
        run: |
          touch LanguageTool-6.6/server.properties

          nohup java \
            -cp LanguageTool-6.6/languagetool-server.jar \
            org.languagetool.server.HTTPServer \
            --config LanguageTool-6.6/server.properties \
            --port 8081 \
            > languagetool.log 2>&1 &

          for attempt in {1..30}; do
            if curl -fsS http://localhost:8081/v2/languages >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat languagetool.log
          exit 1

      - name: Check spelling and grammar
        shell: bash
        run: |
          failed=0

          while IFS= read -r -d '' file; do
            plain_text=$(mktemp)
            pandoc "$file" --to=plain --output="$plain_text"

            response=$(curl -fsS \
              --data-urlencode "text@$plain_text" \
              --data-urlencode "language=en-US" \
              http://localhost:8081/v2/check)

            count=$(jq '.matches | length' <<< "$response")

            if (( count > 0 )); then
              echo "::error file=$file::LanguageTool found $count issue(s)"

              jq -r '
                .matches[] |
                "- \(.message) Suggestions: \([.replacements[].value] | join(", "))"
              ' <<< "$response"

              failed=1
            fi

            rm -f "$plain_text"
          done < <(
            find . -type f -name '*.md' \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              -print0
          )

          exit "$failed"

  build:
    needs: grammar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
